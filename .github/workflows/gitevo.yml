name: Gerar relatorio GitEvo do Flask

on:
  push:
    paths:
      - '.github/workflows/gitevo.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  analisar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Instalar GitEvo e biblioteca de imagem
        run: python -m pip install gitevo matplotlib
      - name: Gerar relatorio de 2020 a 2025
        run: |
          mkdir -p relatorio
          cd relatorio
          gitevo -r python -f 2020 -t 2025 https://github.com/pallets/flask
          python -m pip freeze > dependencias.txt
      - name: Extrair dados e imagem do grafico
        run: |
          python - <<'PY'
          import json
          import re
          from pathlib import Path
          import matplotlib
          matplotlib.use("Agg")
          import matplotlib.pyplot as plt

          root = Path("relatorio")
          html = root / "report_flask.html"
          assert html.is_file(), "GitEvo nao gerou o HTML esperado"
          match = re.search(r'<script id="jsonData" type="application/json">\s*(.*?)\s*</script>', html.read_text(), re.S)
          assert match, "Dados do relatorio nao encontrados"
          charts = json.loads(match.group(1))
          (root / "dados.json").write_text(json.dumps(charts, ensure_ascii=False, indent=2))
          selected = next(c for c in charts if "Function return type" in c["title"] and c["type"] == "line")
          (root / "grafico-selecionado.json").write_text(json.dumps(selected, ensure_ascii=False, indent=2))
          fig, ax = plt.subplots(figsize=(10, 5.5))
          labels = selected["labels"]
          for ds in selected["datasets"]:
              name = {"yes": "Com anotacao de retorno", "no": "Sem anotacao de retorno"}.get(ds["label"], ds["label"])
              ax.plot(labels, ds["data"], marker="o", linewidth=2, label=name)
          ax.set(title="Flask: evolucao das anotacoes de tipo de retorno", xlabel="Ano", ylabel="Quantidade de funcoes")
          ax.set_ylim(bottom=0)
          ax.grid(alpha=0.25)
          ax.legend()
          fig.tight_layout()
          fig.savefig(root / "grafico-tipos-retorno.png", dpi=180)
          print(json.dumps(selected, ensure_ascii=False, indent=2))
          PY
      - name: Salvar relatorio e grafico no fork
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add relatorio/report_flask.html relatorio/dependencias.txt relatorio/dados.json relatorio/grafico-selecionado.json relatorio/grafico-tipos-retorno.png
          if ! git diff --cached --quiet; then
            git commit -m "Adiciona relatorio GitEvo e grafico de tipos de retorno do Flask"
            git push
          fi
